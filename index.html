<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Goku Destroy</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}

body{
overflow:hidden;
background:skyblue;
touch-action:none;
}

#ground{
position:fixed;
bottom:0;
left:0;
width:100%;
height:100px;
background:green;
}

#player{
position:absolute;
left:150px;
bottom:100px;
width:100px;
height:auto;
border:2px solid red;
}
  
#score{
position:fixed;
top:10px;
left:10px;
background:black;
color:white;
padding:10px;
border-radius:10px;
color:white;
}
  
button{
width:60px;
height:60px;
font-size:24px;
border:none;
border-radius:10px;
}

#left{
position:fixed;
left:20px;
bottom:120px;
}

#right{
position:fixed;
left:90px;
bottom:120px;
}

#jump{
position:fixed;
right:90px;
bottom:120px;
}

#attack{
position:fixed;
right:20px;
bottom:120px;
}

</style>
</head>

<body oncontextmenu="return false;">

<img id="player" src="Screenshot_20260606-204556.jpg">
<div id="score">🏆 0</div>
<div id="ground"></div>

<button id="left">⬅️</button>
<button id="right">➡️</button>

<button id="jump">⬆️</button>
<button id="attack">🔥</button>

<script>

let player=document.getElementById("player");

let x=150;
let y=100;

let moveLeft=false;
let moveRight=false;
let jumping=false;
let velocityY=0;

function updatePlayer(){
player.style.left=x+"px";
player.style.bottom=y+"px";
}

document.getElementById("left").ontouchstart=()=>{
moveLeft=true;
};

document.getElementById("left").ontouchend=()=>{
moveLeft=false;
};

document.getElementById("right").ontouchstart=()=>{
moveRight=true;
};

document.getElementById("right").ontouchend=()=>{
moveRight=false;
};

document.getElementById("jump").ontouchstart=()=>{

if(!jumping){

jumping=true;
velocityY=15;

}

};

document.getElementById("attack").ontouchstart=()=>{

let beam=document.createElement("div");

beam.style.position="absolute";
beam.style.left=(x+80)+"px";
beam.style.bottom=(y+50)+"px";

beam.style.width="80px";
beam.style.height="30px";

beam.style.background="red";
beam.style.borderRadius="20px";
beam.style.boxShadow="0 0 20px orange";

document.body.appendChild(beam);

let bx=x+80;

let move=setInterval(()=>{

bx+=15;

beam.style.left=bx+"px";

if(bx>window.innerWidth){

clearInterval(move);
beam.remove();

}

},16);

};

function gameLoop(){

if(moveLeft){
x-=4;
}

if(moveRight){
x+=4;
}

if(x<0){
x=0;
}

if(x>window.innerWidth-100){
x=window.innerWidth-100;
}

if(jumping){

y+=velocityY;
velocityY-=0.8;

if(y<=100){

y=100;
jumping=false;
velocityY=0;

}

}

if(!jumping){
y=100;
velocityY=0;
}
  
}

}

updatePlayer();

requestAnimationFrame(gameLoop);

}

updatePlayer();
gameLoop();

</script>

</body>
</html>
