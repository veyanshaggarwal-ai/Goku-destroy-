<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
overflow:hidden;
background:skyblue;
touch-action:none;
}

#player{
position:absolute;
left:300px;
bottom:100px;
width:120px;
height:auto;
user-select:none;
-webkit-user-drag:none;
}

#ground{
position:fixed;
bottom:0;
width:100%;
height:100px;
background:green;
}

button{
width:80px;
height:80px;
font-size:35px;
touch-action:none;
user-select:none;
}

#left{
position:fixed;
left:20px;
bottom:20px;
}

#right{
position:fixed;
left:120px;
bottom:20px;
}

#jump{
position:fixed;
right:120px;
bottom:20px;
}

#kame{
position:fixed;
right:20px;
bottom:20px;
}

</style>
</head>

<body>

<img id="player" src="IMG_20260605_183231.jpg">

<div id="ground"></div>

<button id="left">⬅️</button>
<button id="right">➡️</button>

<button id="jump">⬆️</button>
<button id="kame">🔥</button>

<script>

let player=document.getElementById("player");

let x=300;
let y=100;

let moving=false;
let direction=0;
let jumping=false;

player.style.left=x+"px";
player.style.bottom=y+"px";

function moveLeft(){
direction=-1;
moving=true;
}

function moveRight(){
direction=1;
moving=true;
}

function stopMove(){
moving=false;
}

function jump(){

if(jumping) return;

jumping=true;

let up=setInterval(()=>{

y+=10;
player.style.bottom=y+"px";

if(y>=250){

clearInterval(up);

let down=setInterval(()=>{

y-=10;
player.style.bottom=y+"px";

if(y<=100){

clearInterval(down);

y=100;
player.style.bottom=y+"px";

jumping=false;

}

},20);

}

},20);

}

setInterval(()=>{

if(moving){

x+=direction*5;

if(x<0) x=0;

if(x>window.innerWidth-120)
x=window.innerWidth-120;

player.style.left=x+"px";

}

},16);

left.addEventListener("touchstart",moveLeft);
left.addEventListener("touchend",stopMove);

right.addEventListener("touchstart",moveRight);
right.addEventListener("touchend",stopMove);

jump.addEventListener("click",jump);

kame.addEventListener("click",()=>{

alert("🔥 KAMEHAMEHA!");

});

</script>

</body>
</html>
