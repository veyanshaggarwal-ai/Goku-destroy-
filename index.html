<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
overflow:hidden;
background:skyblue;
touch-action:none;
}

#ground{
position:fixed;
bottom:0;
width:100%;
height:100px;
background:green;
}

#player{
position:absolute;
left:300px;
bottom:100px;
width:120px;
height:auto;
user-select:none;
-webkit-user-drag:none;
}

.controls{
position:fixed;
bottom:20px;
width:100%;
text-align:center;
z-index:999;
}

button{
width:80px;
height:80px;
font-size:35px;
margin:5px;
touch-action:none;
user-select:none;
}

</style>
</head>

<body>

<img id="player" src="IMG_20260605_183231.jpg">

<div id="ground"></div>

<div class="controls">
<button id="left">⬅️</button>
<button id="jump">⬆️</button>
<button id="right">➡️</button>
</div>

<script>

let player=document.getElementById("player");

let x=300;
let y=100;

let moving=false;
let direction=0;
let jumping=false;

player.style.left=x+"px";
player.style.bottom=y+"px";

function moveLeft(){
direction=-1;
moving=true;
}

function moveRight(){
direction=1;
moving=true;
}

function stopMove(){
moving=false;
}

function jump(){

if(jumping) return;

jumping=true;

let up=setInterval(()=>{

y+=10;
player.style.bottom=y+"px";

if(y>=250){

clearInterval(up);

let down=setInterval(()=>{

y-=10;
player.style.bottom=y+"px";

if(y<=100){

y=100;
player.style.bottom=y+"px";

clearInterval(down);
jumping=false;

}

},20);

}

},20);

}

setInterval(()=>{

if(moving){

x+=direction*5;

if(x<0){
x=0;
}

if(x>window.innerWidth-120){
x=window.innerWidth-120;
}

player.style.left=x+"px";

}

},16);

document.getElementById("left").addEventListener("touchstart",moveLeft);
document.getElementById("left").addEventListener("touchend",stopMove);

document.getElementById("right").addEventListener("touchstart",moveRight);
document.getElementById("right").addEventListener("touchend",stopMove);

document.getElementById("jump").addEventListener("click",jump);

</script>

</body>
</html>
