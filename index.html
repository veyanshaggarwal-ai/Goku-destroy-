<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goku Destroy V2</title>

<style>
body{
margin:0;
overflow:hidden;
background:skyblue;
touch-action:none;
}

#player{
position:absolute;
left:100px;
top:300px;
width:90px;
height:90px;
}

#ground{
position:fixed;
bottom:0;
left:0;
width:100%;
height:60px;
background:green;
}

.controls{
position:fixed;
bottom:70px;
width:100%;
text-align:center;
}

button{
font-size:30px;
padding:15px;
margin:5px;
}
</style>
</head>

<body>

<img id="player" src="IMG_20260605_165941.jpg">

<div id="ground"></div>

<div class="controls">
<button id="leftBtn">⬅️</button>
<button id="jumpBtn">⬆️</button>
<button id="rightBtn">➡️</button>
</div>

<script>

let player=document.getElementById("player");

let x=100;
let y=300;

let velocityY=0;
let gravity=0.8;

let moveLeft=false;
let moveRight=false;

let onGround=true;

function gameLoop(){

if(moveLeft){
x-=4;
}

if(moveRight){
x+=4;
}

velocityY+=gravity;
y+=velocityY;

if(y>300){
y=300;
velocityY=0;
onGround=true;
}

player.style.left=x+"px";
player.style.top=y+"px";

requestAnimationFrame(gameLoop);
}

gameLoop();

document.getElementById("leftBtn").ontouchstart=()=>{
moveLeft=true;
};

document.getElementById("leftBtn").ontouchend=()=>{
moveLeft=false;
};

document.getElementById("rightBtn").ontouchstart=()=>{
moveRight=true;
};

document.getElementById("rightBtn").ontouchend=()=>{
moveRight=false;
};

document.getElementById("jumpBtn").onclick=()=>{

if(onGround){
velocityY=-15;
onGround=false;
}

};

</script>

</body>
</html>
