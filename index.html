<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;
overflow:hidden;
background:skyblue;
touch-action:none;
}

#health{
position:fixed;
top:10px;
left:10px;
background:red;
color:white;
padding:10px;
border-radius:10px;
font-weight:bold;
z-index:10;
}

#score{
position:fixed;
top:10px;
right:10px;
background:black;
color:white;
padding:10px;
border-radius:10px;
font-weight:bold;
z-index:10;
}

#ground{
position:fixed;
bottom:0;
width:100%;
height:100px;
background:green;
}

#player{
position:absolute;
left:100px;
bottom:100px;
width:120px;
height:auto;
user-select:none;
-webkit-user-drag:none;
}


.controls{
position:fixed;
bottom:120px;
width:100%;
text-align:center;
}

button{
width:80px;
height:80px;
font-size:35px;
margin:5px;
}
</style>
</head>

<body>

<div id="health">❤️ 100</div>
<div id="score">🏆 0</div>

<img id="player" src="IMG_20260605_183231.jpg">

<div id="ground"></div>

<div class="controls">
<button id="left">⬅️</button>
<button id="jump">⬆️</button>
<button id="right">➡️</button>
</div>

<script>

let player=document.getElementById("player");

let x=100;
let y=100;

let moveLeft=false;
let moveRight=false;
let jumping=false;

function startLeft(){
moveLeft=true;
}

function stopLeft(){
moveLeft=false;
}

function startRight(){
moveRight=true;
}

function stopRight(){
moveRight=false;
}

function jump(){

if(jumping) return;

jumping=true;

let up=setInterval(()=>{

y+=10;
player.style.bottom=y+"px";

if(y>=250){

clearInterval(up);

let down=setInterval(()=>{

y-=10;
player.style.bottom=y+"px";

if(y<=100){

clearInterval(down);
jumping=false;

}

},20);

}

},20);

}

setInterval(()=>{

if(moveLeft){

x-=5;
player.style.left=x+"px";

}

if(moveRight){

x+=5;
player.style.left=x+"px";

}

},16);

document.getElementById("left").addEventListener("touchstart",startLeft);
document.getElementById("left").addEventListener("touchend",stopLeft);

document.getElementById("right").addEventListener("touchstart",startRight);
document.getElementById("right").addEventListener("touchend",stopRight);

document.getElementById("jump").addEventListener("click",jump);

</script>

</body>
</html>
