<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

body{
  overflow:hidden;
  background:skyblue;
}

#ground{
  position:fixed;
  bottom:0;
  width:100%;
  height:120px;
  background:green;
}

#player{
  position:absolute;
  left:100px;
  bottom:120px;
  width:120px;
}

#leftBox{
  position:fixed;
  left:15px;
  bottom:20px;
}

#rightBox{
  position:fixed;
  right:15px;
  bottom:20px;
}

button{
  width:80px;
  height:80px;
  font-size:35px;
  margin:5px;
}
</style>
</head>

<body oncontextmenu="return false">

<img id="player" src="Screenshot_20260606-204556.jpg">

<div id="ground"></div>

<div id="leftBox">
<button id="left">⬅</button>
<button id="right">➡</button>
</div>

<div id="rightBox">
<button id="jump">⬆</button>
<button id="attack">🔥</button>
</div>

<script>

document.addEventListener("contextmenu",e=>e.preventDefault());

let player=document.getElementById("player");

let x=100;
let y=120;
let jumping=false;

function updatePlayer(){
  player.style.left=x+"px";
  player.style.bottom=y+"px";
}

document.getElementById("left").onclick=()=>{
  x=Math.max(0,x-30);
  updatePlayer();
};

document.getElementById("right").onclick=()=>{
  x=Math.min(window.innerWidth-120,x+30);
  updatePlayer();
};

document.getElementById("jump").onclick=()=>{

  if(jumping) return;

  jumping=true;

  let up=setInterval(()=>{

    y+=10;
    updatePlayer();

    if(y>=260){

      clearInterval(up);

      let down=setInterval(()=>{

        y-=10;
        updatePlayer();

        if(y<=120){
          y=120;
          jumping=false;
          clearInterval(down);
        }

      },20);

    }

  },20);

};

document.getElementById("attack").onclick=()=>{
  alert("KAMEHAMEHA!");
};

updatePlayer();

</script>

</body>
</html>
