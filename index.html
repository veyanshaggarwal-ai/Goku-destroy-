<script>

let player=document.getElementById("player");

let x=100;
let y=100;

let moveLeft=false;
let moveRight=false;
let jumping=false;

function startLeft(){
moveLeft=true;
}

function stopLeft(){
moveLeft=false;
}

function startRight(){
moveRight=true;
}

function stopRight(){
moveRight=false;
}

function jump(){

if(jumping) return;

jumping=true;

let up=setInterval(()=>{

y+=10;
player.style.bottom=y+"px";

if(y>=250){

clearInterval(up);

let down=setInterval(()=>{

y-=10;
player.style.bottom=y+"px";

if(y<=100){

clearInterval(down);
jumping=false;

}

},20);

}

},20);

}

setInterval(()=>{

if(moveLeft){

x-=5;

if(x<0){
x=0;
}

player.style.left=x+"px";

}

if(moveRight){

x+=5;

if(x>window.innerWidth-120){
x=window.innerWidth-120;
}

player.style.left=x+"px";

}

},16);

let leftBtn=document.getElementById("left");
let rightBtn=document.getElementById("right");
let jumpBtn=document.getElementById("jump");

leftBtn.addEventListener("touchstart",startLeft);
leftBtn.addEventListener("touchend",stopLeft);
leftBtn.addEventListener("touchcancel",stopLeft);

rightBtn.addEventListener("touchstart",startRight);
rightBtn.addEventListener("touchend",stopRight);
rightBtn.addEventListener("touchcancel",stopRight);

jumpBtn.addEventListener("touchstart",jump);

document.addEventListener("touchend",()=>{


moveLeft=false;
moveRight=false;

});

</script>
