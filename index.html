<!DOCTYPE html><html>
<head>
<title>Goku Destroy</title><style>
body{
margin:0;
background:skyblue;
overflow:hidden;
}

#goku{
width:60px;
height:60px;
background:orange;
position:absolute;
left:100px;
top:250px;
border-radius:10px;
}
</style></head><body><div id="goku"></div><script>
let goku=document.getElementById("goku");
let x=100;

document.addEventListener("keydown",function(e){

if(e.key=="ArrowRight"){
x=x+20;
goku.style.left=x+"px";
}

if(e.key=="ArrowLeft"){
x=x-20;
goku.style.left=x+"px";
}

});<div style="position:fixed;bottom:20px;left:20px;">
<button onclick="moveLeft()">⬅️</button>
<button onclick="moveRight()">➡️</button>
</div>

<script>
function moveLeft(){
x=x-20;
goku.style.left=x+"px";
}

function moveRight(){
x=x+20;
goku.style.left=x+"px";
}
</script>
  
</script></body>
</html>
