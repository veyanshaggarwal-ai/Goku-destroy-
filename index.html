<!DOCTYPE html><html>
<head>
<title>Goku Destroy</title><style>
body{
margin:0;
background:skyblue;
overflow:hidden;
}

#goku{
width:60px;
height:60px;
background:orange;
position:absolute;
left:100px;
top:250px;
border-radius:10px;
}

.controls{
position:fixed;
bottom:20px;
left:20px;
}

button{
font-size:30px;
padding:10px;
margin:5px;
}
</style></head><body><div id="goku"></div><div class="controls">
<button onclick="moveLeft()">⬅️</button>
<button onclick="moveRight()">➡️</button>
</div><script>
let goku=document.getElementById("goku");
let x=100;

function moveLeft(){
x=x-20;
goku.style.left=x+"px";
}

function moveRight(){
x=x+20;
goku.style.left=x+"px";
}
</script></body>
</html>
