<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goku Destroy V1</title>

<style>

*{
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
overflow:hidden;
background:skyblue;
touch-action:none;
}

#health{
position:fixed;
top:10px;
left:10px;
background:red;
color:white;
padding:10px;
border-radius:10px;
font-weight:bold;
z-index:999;
}

#score{
position:fixed;
top:10px;
right:10px;
background:black;
color:white;
padding:10px;
border-radius:10px;
font-weight:bold;
z-index:999;
}

#ground{
position:fixed;
bottom:0;
left:0;
width:100%;
height:100px;
background:green;
}

#player{
position:absolute;
left:300px;
bottom:100px;
width:90px;
height:120px;
z-index:10;
}

button{
width:60px;
height:60px;
font-size:24px;
border-radius:12px;
border:none;
}

#left{
position:fixed;
left:15px;
bottom:120px;
}

#right{
position:fixed;
left:85px;
bottom:120px;
}

#jump{
position:fixed;
right:85px;
bottom:120px;
}

#kame{
position:fixed;
right:15px;
bottom:120px;
}

</style>
</head>

<body oncontextmenu="return false;">

<div id="health">❤️ 100</div>
<div id="score">🏆 0</div>

<img id="player" src="screenshot_165941.jpg">

<div id="ground"></div>

<button id="left">⬅️</button>
<button id="right">➡️</button>

<button id="jump">⬆️</button>
<button id="kame">🔥</button>

<script>

document.addEventListener("contextmenu",e=>e.preventDefault());

let player=document.getElementById("player");

let x=300;
let y=100;

let moveLeft=false;
let moveRight=false;
let jumping=false;

function jump(){

if(jumping) return;

jumping=true;

let up=setInterval(()=>{

y+=10;
player.style.bottom=y+"px";

if(y>=250){

clearInterval(up);

let down=setInterval(()=>{

y-=10;
player.style.bottom=y+"px";

if(y<=100){

y=100;
player.style.bottom=y+"px";

clearInterval(down);

jumping=false;

}

},20);

}

},20);

}

setInterval(()=>{

if(moveLeft){

x-=5;

if(x<0){
x=0;
}

player.style.left=x+"px";

}

if(moveRight){

x+=5;

if(x>window.innerWidth-90){
x=window.innerWidth-90;
}

player.style.left=x+"px";

}

},16);

document.getElementById("left").addEventListener("touchstart",()=>{

moveLeft=true;

});

document.getElementById("left").addEventListener("touchend",()=>{

moveLeft=false;

});

document.getElementById("right").addEventListener("touchstart",()=>{

moveRight=true;

});

document.getElementById("right").addEventListener("touchend",()=>{

moveRight=false;

});

document.getElementById("jump").addEventListener("touchstart",jump);

document.getElementById("kame").addEventListener("touchstart",()=>{

alert("🔥 KAMEHAMEHA!");

});

document.addEventListener("touchend",()=>{

moveLeft=false;
moveRight=false;

});

</script>

</body>
</html>
